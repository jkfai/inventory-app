<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>库存管理系统 · Inventory System</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#f4f6fb;color:#1b2233;font-size:14px;-webkit-font-smoothing:antialiased;
  }
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#d3d9e6;border-radius:9px}
  ::-webkit-scrollbar-thumb:hover{background:#bcc5d8}

  /* ---------- 布局 ---------- */
  .app{display:flex;min-height:100vh}
  .sidebar{
    width:236px;background:#151b2e;color:#aeb6cc;padding:22px 14px 18px;
    position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:50;
  }
  .logo{display:flex;align-items:center;gap:11px;padding:0 8px 22px}
  .logo-mark{
    width:38px;height:38px;border-radius:11px;flex:none;
    background:linear-gradient(135deg,#4f6ef7,#7c5cff);
    display:flex;align-items:center;justify-content:center;color:#fff;
    box-shadow:0 6px 16px rgba(79,110,247,.4);
  }
  .logo-mark svg{width:20px;height:20px}
  .logo-title{color:#fff;font-size:15px;font-weight:700;letter-spacing:.3px}
  .logo-sub{font-size:10.5px;color:#5f6a85;letter-spacing:.6px;margin-top:2px}
  nav{display:flex;flex-direction:column;gap:3px;flex:1}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;
    cursor:pointer;font-size:13.5px;font-weight:500;transition:.16s;color:#98a1ba;
    border:none;background:transparent;font-family:inherit;text-align:left;width:100%;
  }
  .nav-item svg{width:17px;height:17px;flex:none;opacity:.85}
  .nav-item:hover{background:#1e263d;color:#e2e7f5}
  .nav-item.active{background:linear-gradient(90deg,#4f6ef7,#5a76f9);color:#fff;box-shadow:0 6px 18px rgba(79,110,247,.35)}
  .nav-item .nav-badge{
    margin-left:auto;background:#f04438;color:#fff;font-size:10.5px;font-weight:700;
    padding:1px 7px;border-radius:20px;min-width:19px;text-align:center;
  }
  .nav-item.active .nav-badge{background:rgba(255,255,255,.28)}
  .sidebar-foot{border-top:1px solid #232b42;padding-top:14px;margin-top:10px}
  .side-btn{
    width:100%;display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;
    background:transparent;border:1px solid #2a3350;color:#8d97b3;font-size:12.5px;
    cursor:pointer;font-family:inherit;transition:.16s;font-weight:500;
  }
  .side-btn:hover{background:#1e263d;color:#e2e7f5;border-color:#3a4568}
  .side-btn svg{width:15px;height:15px}
  .side-note{font-size:11px;color:#4e5872;padding:12px 12px 0;line-height:1.6}

  .main{margin-left:236px;flex:1;padding:26px 30px 50px;min-width:0}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
  .topbar h1{font-size:23px;font-weight:700;letter-spacing:-.3px}
  .topbar p{color:#7b849a;font-size:13px;margin-top:5px}

  /* ---------- 通用组件 ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:7px;padding:10px 17px;border-radius:10px;
    border:1px solid transparent;font-size:13.5px;font-weight:600;cursor:pointer;
    font-family:inherit;transition:.16s;background:#fff;color:#1b2233;white-space:nowrap;
  }
  .btn svg{width:15px;height:15px}
  .btn.primary{background:#4f6ef7;color:#fff;box-shadow:0 5px 16px rgba(79,110,247,.3)}
  .btn.primary:hover{background:#3d59e0;transform:translateY(-1px)}
  .btn.primary:active{transform:none}
  .btn.ghost{border-color:#e3e7f0;color:#4a5468}
  .btn.ghost:hover{background:#f7f9fc;border-color:#d3d9e6}
  .btn.tiny{padding:6px 12px;font-size:12.5px;border-radius:8px}

  .card{background:#fff;border-radius:16px;border:1px solid #e9edf5;box-shadow:0 2px 10px rgba(21,27,46,.04);overflow:hidden}
  .card-head{display:flex;align-items:center;gap:10px;padding:17px 20px;border-bottom:1px solid #eef1f7}
  .card-head h3{font-size:14.5px;font-weight:700}
  .card-head .badge{
    background:#fef3f2;color:#f04438;font-size:11.5px;font-weight:700;
    padding:2px 9px;border-radius:20px;
  }
  .card-body{padding:18px 20px}

  /* 统计卡 */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
  .stat{
    background:#fff;border-radius:16px;border:1px solid #e9edf5;padding:18px 20px;
    display:flex;align-items:center;gap:15px;box-shadow:0 2px 10px rgba(21,27,46,.04);
    transition:.18s;
  }
  .stat:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(21,27,46,.08)}
  .stat-icon{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
  .stat-icon svg{width:21px;height:21px}
  .stat-label{font-size:12.5px;color:#7b849a;font-weight:500}
  .stat-value{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:3px;line-height:1.15}
  .stat-sub{font-size:11.5px;color:#98a1ba;margin-top:3px}

  .dash-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-bottom:16px}

  /* 分类条形图 */
  .bar-row{margin-bottom:15px}
  .bar-row:last-child{margin-bottom:0}
  .bar-label{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px}
  .bar-label span:first-child{font-weight:600;color:#3d4759}
  .bar-label span:last-child{color:#7b849a;font-variant-numeric:tabular-nums}
  .bar-track{height:8px;background:#f1f4fa;border-radius:8px;overflow:hidden}
  .bar-fill{height:100%;border-radius:8px;transition:width .5s cubic-bezier(.2,.8,.3,1)}

  /* 预警项 */
  .alert-item{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;border-radius:12px;background:#fefaf5;border:1px solid #fdecd2;margin-bottom:9px;
  }
  .alert-item:last-child{margin-bottom:0}
  .alert-item.critical{background:#fef4f3;border-color:#fbd9d5}
  .alert-name{font-size:13.5px;font-weight:600}
  .alert-meta{font-size:11.5px;color:#98a1ba;margin-top:3px}
  .alert-right{display:flex;align-items:center;gap:11px;flex:none}
  .alert-qty{font-size:16px;font-weight:700;color:#f04438;font-variant-numeric:tabular-nums}
  .alert-qty span{font-size:11px;font-weight:500;color:#98a1ba}

  /* 动态列表 */
  .rec-item{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid #f2f5fa}
  .rec-item:last-child{border-bottom:none;padding-bottom:0}
  .rec-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
  .rec-icon svg{width:16px;height:16px}
  .rec-icon.in{background:#e9f9f1;color:#12b76a}
  .rec-icon.out{background:#eef2fe;color:#4f6ef7}
  .rec-title{font-size:13.5px;font-weight:600}
  .rec-meta{font-size:11.5px;color:#98a1ba;margin-top:3px}
  .rec-time{font-size:11.5px;color:#a9b1c4;margin-left:auto;flex:none}

  /* 工具栏 */
  .toolbar{display:flex;align-items:center;gap:11px;padding:15px 20px;border-bottom:1px solid #eef1f7;flex-wrap:wrap}
  .search{position:relative;flex:1;min-width:190px;max-width:340px}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:#a9b1c4}
  .search input{
    width:100%;padding:10px 13px 10px 35px;border:1px solid #e3e7f0;border-radius:10px;
    font-size:13.5px;font-family:inherit;outline:none;transition:.16s;background:#fafbfe;color:#1b2233;
  }
  .search input:focus{border-color:#4f6ef7;background:#fff;box-shadow:0 0 0 3px rgba(79,110,247,.12)}
  .field-select{
    padding:10px 13px;border:1px solid #e3e7f0;border-radius:10px;font-size:13.5px;
    font-family:inherit;outline:none;background:#fafbfe;color:#1b2233;cursor:pointer;transition:.16s;
  }
  .field-select:focus{border-color:#4f6ef7;background:#fff}
  .seg{display:inline-flex;background:#f1f4fa;border-radius:10px;padding:3px;gap:2px}
  .seg button{
    border:none;background:transparent;padding:7px 17px;border-radius:8px;font-size:13px;
    font-weight:600;color:#7b849a;cursor:pointer;font-family:inherit;transition:.16s;
  }
  .seg button.active{background:#fff;color:#1b2233;box-shadow:0 1px 4px rgba(21,27,46,.1)}

  /* 表格 */
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{
    text-align:left;padding:12px 20px;font-size:11.5px;font-weight:700;color:#8891a8;
    letter-spacing:.4px;background:#fafbfe;border-bottom:1px solid #eef1f7;white-space:nowrap;
  }
  td{padding:13px 20px;border-bottom:1px solid #f2f5fa;vertical-align:middle}
  tbody tr{transition:.14s}
  tbody tr:hover{background:#fafbff}
  tbody tr:last-child td{border-bottom:none}
  .p-name{font-weight:600;color:#1b2233}
  .p-sku{font-size:11.5px;color:#a9b1c4;margin-top:3px;font-family:ui-monospace,Menlo,monospace}
  .num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .num b{font-weight:700}
  .unit{font-size:11.5px;color:#98a1ba;font-weight:500}
  .muted{color:#8891a8;font-size:12.5px}
  .txt-green{color:#12b76a;font-weight:700}
  .txt-red{color:#f04438;font-weight:700}
  .tag{
    display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;
    background:#f1f4fa;color:#5b6478;
  }
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .pill.green{background:#e9f9f1;color:#0e9f5f}
  .pill.orange{background:#fef6e9;color:#dc7a04}
  .pill.red{background:#fef3f2;color:#e0362b}
  .pill.blue{background:#eef2fe;color:#4f6ef7}
  .ops{display:flex;gap:6px}
  .icon-btn{
    width:31px;height:31px;display:inline-flex;align-items:center;justify-content:center;
    border-radius:9px;border:1px solid #e7eaf2;background:#fff;color:#8891a8;cursor:pointer;transition:.15s;
  }
  .icon-btn svg{width:15px;height:15px}
  .icon-btn:hover{color:#4f6ef7;border-color:#c9d3fb;background:#f5f7ff}
  .icon-btn.danger:hover{color:#f04438;border-color:#fbc9c5;background:#fef4f3}
  .empty{text-align:center;padding:52px 20px;color:#a9b1c4;font-size:13.5px}
  .empty svg{width:38px;height:38px;opacity:.4;margin-bottom:12px}

  /* 预警卡片页 */
  .alert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:15px}
  .alert-card{
    background:#fff;border-radius:15px;border:1px solid #fbd9d5;padding:17px 18px;
    box-shadow:0 2px 10px rgba(240,68,56,.06);
  }
  .alert-card .ac-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .ac-name{font-size:14.5px;font-weight:700}
  .ac-sku{font-size:11.5px;color:#a9b1c4;margin-top:4px;font-family:ui-monospace,Menlo,monospace}
  .ac-nums{display:flex;gap:22px;margin:15px 0 14px}
  .ac-num-label{font-size:11.5px;color:#98a1ba}
  .ac-num-val{font-size:18px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}

  /* 模态框 */
  .mask{
    position:fixed;inset:0;background:rgba(21,27,46,.52);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:900;padding:20px;
    opacity:0;pointer-events:none;transition:.18s;
  }
  .mask.show{opacity:1;pointer-events:auto}
  .modal{
    background:#fff;border-radius:19px;width:100%;max-width:530px;max-height:90vh;overflow:auto;
    transform:translateY(12px) scale(.98);transition:.2s;box-shadow:0 26px 64px rgba(0,0,0,.28);
  }
  .mask.show .modal{transform:none}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid #eef1f7}
  .modal-head h3{font-size:16px;font-weight:700}
  .modal-body{padding:22px}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid #eef1f7;background:#fafbfe}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
  .field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}
  .grid2 .field{margin-bottom:0}
  .field label{font-size:12.5px;font-weight:600;color:#5b6478}
  .field label .req{color:#f04438}
  .field input,.field select{
    padding:10px 13px;border:1px solid #e3e7f0;border-radius:10px;font-size:14px;
    font-family:inherit;color:#1b2233;background:#fafbfe;outline:none;transition:.16s;width:100%;
  }
  .field input:focus,.field select:focus{border-color:#4f6ef7;background:#fff;box-shadow:0 0 0 3px rgba(79,110,247,.12)}
  .field input:disabled{background:#f4f6fb;color:#8891a8;cursor:not-allowed}
  .hint{font-size:11.5px;color:#a9b1c4;margin-top:-4px}
  .stock-preview{
    background:#f7f9fd;border:1px solid #e9edf5;border-radius:12px;padding:14px 16px;
    display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;
  }
  .stock-preview .sp-label{font-size:12px;color:#7b849a}
  .stock-preview .sp-val{font-size:19px;font-weight:700;margin-top:3px}
  .type-toggle{display:flex;gap:8px;margin-bottom:18px}
  .type-toggle button{
    flex:1;padding:12px;border-radius:11px;border:1.5px solid #e3e7f0;background:#fff;
    font-size:13.5px;font-weight:600;color:#7b849a;cursor:pointer;font-family:inherit;
    transition:.16s;display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .type-toggle button svg{width:15px;height:15px}
  .type-toggle button.on.in{border-color:#12b76a;background:#e9f9f1;color:#0e9f5f}
  .type-toggle button.on.out{border-color:#4f6ef7;background:#eef2fe;color:#4f6ef7}

  /* 提示 */
  .toast-wrap{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:10px;z-index:1100}
  .toast{
    background:#151b2e;color:#fff;padding:13px 19px;border-radius:12px;font-size:13.5px;
    font-weight:500;box-shadow:0 12px 34px rgba(0,0,0,.24);display:flex;align-items:center;gap:9px;
    animation:slideIn .26s cubic-bezier(.2,.8,.3,1);
  }
  .toast.ok{border-left:3px solid #12b76a}
  .toast.warn{border-left:3px solid #f79009}
  .toast.err{border-left:3px solid #f04438}
  @keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

  .page{display:none;animation:fade .22s ease}
  .page.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  @media(max-width:1080px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .dash-grid{grid-template-columns:1fr}
  }
  @media(max-width:820px){
    .sidebar{
      width:100%;height:auto;bottom:auto;flex-direction:row;align-items:center;
      padding:11px 12px;overflow-x:auto;gap:8px;
    }
    .logo{padding:0 10px 0 4px;flex:none}
    .logo-sub{display:none}
    .logo-title{font-size:13px}
    nav{flex-direction:row;flex:1;gap:5px;min-width:0}
    .nav-item{width:auto;padding:9px 13px;font-size:13px;flex:none}
    .nav-item span.nav-text{display:none}
    .nav-item svg{margin:0}
    .sidebar-foot{display:none}
    .main{margin-left:0;padding:78px 16px 40px}
    .grid2{grid-template-columns:1fr}
    .topbar h1{font-size:20px}
    .stats{grid-template-columns:1fr;gap:12px}
    .toast-wrap{left:16px;right:16px;bottom:16px}
  }
</style>
</head>
<body>
<div class="app">
  <!-- ========== 侧边栏 ========== -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark" id="logoMark"></div>
      <div>
        <div class="logo-title">库存管理</div>
        <div class="logo-sub">INVENTORY SYSTEM</div>
      </div>
    </div>
    <nav id="nav">
      <button class="nav-item active" data-page="dash" onclick="go('dash')">
        <span class="ico"></span><span class="nav-text">概览</span>
      </button>
      <button class="nav-item" data-page="products" onclick="go('products')">
        <span class="ico"></span><span class="nav-text">商品管理</span>
      </button>
      <button class="nav-item" data-page="records" onclick="go('records')">
        <span class="ico"></span><span class="nav-text">出入库记录</span>
      </button>
      <button class="nav-item" data-page="alerts" onclick="go('alerts')">
        <span class="ico"></span><span class="nav-text">库存预警</span>
        <span class="nav-badge" id="navAlertBadge" hidden>0</span>
      </button>
    </nav>
    <div class="sidebar-foot">
      <button class="side-btn" onclick="resetDemo()">
        <span class="ico"></span>重置演示数据
      </button>
      <div class="side-note">数据保存在本机浏览器中，刷新不会丢失。</div>
    </div>
  </aside>

  <!-- ========== 主内容 ========== -->
  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">概览</h1>
        <p id="pageSub">库存总览、分类分布与预警信息</p>
      </div>
      <button class="btn primary" onclick="openProductModal()" id="addBtn">新增商品</button>
    </header>

    <!-- 概览页 -->
    <section class="page active" id="page-dash">
      <div class="stats" id="statsGrid"></div>
      <div class="dash-grid">
        <div class="card">
          <div class="card-head"><h3>分类库存成本分布</h3></div>
          <div class="card-body" id="catChart"></div>
        </div>
        <div class="card">
          <div class="card-head"><h3>库存预警</h3><span class="badge" id="alertCount">0</span></div>
          <div class="card-body" id="alertList"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>最近动态</h3></div>
        <div class="card-body" id="recentList"></div>
      </div>
    </section>

    <!-- 商品页 -->
    <section class="page" id="page-products">
      <div class="card">
        <div class="toolbar">
          <div class="search">
            <span class="ico"></span>
            <input id="searchInput" placeholder="搜索商品名称或 SKU…" oninput="onSearch(this.value)">
          </div>
          <select class="field-select" id="catFilter" onchange="onCat(this.value)"></select>
          <button class="btn ghost" onclick="exportCSV()" id="exportBtn">导出 CSV</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>商品</th><th>分类</th><th>库存</th><th>进价</th><th>售价</th><th>状态</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="productTbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 记录页 -->
    <section class="page" id="page-records">
      <div class="card">
        <div class="toolbar">
          <div class="seg" id="recSeg">
            <button class="active" onclick="setRecFilter('all',this)">全部</button>
            <button onclick="setRecFilter('in',this)">入库</button>
            <button onclick="setRecFilter('out',this)">出库</button>
          </div>
          <span class="muted" id="recCount" style="margin-left:auto"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>时间</th><th>商品</th><th>类型</th><th>数量</th><th>变动后库存</th><th>备注</th></tr>
            </thead>
            <tbody id="recordTbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 预警页 -->
    <section class="page" id="page-alerts">
      <div class="alert-grid" id="alertGrid"></div>
    </section>
  </main>
</div>

<!-- ========== 商品表单模态框 ========== -->
<div class="mask" id="productModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="pmTitle">新增商品</h3>
      <button class="icon-btn" onclick="closeProductModal()" id="pmClose"></button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>商品名称 <span class="req">*</span></label>

};

/* ============================================================
   状态与存储
   ============================================================ */
let state = {
  products: [],
  records: [],
  q: '',
  cat: '全部',
  recFilter: 'all',
  page: 'dash'
};

const LS_KEY = 'inventory_system_v1';

function save(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({ products: state.products, records: state.records }));
  }catch(e){ /* 隐私模式下静默失败 */ }
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      state.products = Array.isArray(d.products) ? d.products : [];
      state.records  = Array.isArray(d.records)  ? d.records  : [];
      return true;
    }
  }catch(e){}
  return false;
}

/* ============================================================
   工具函数
   ============================================================ */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function money(n){
  const v = Number(n) || 0;
  return '¥' + v.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtNum(n){
  return (Number(n) || 0).toLocaleString('zh-CN');
}
const pad2 = n => String(n).padStart(2, '0');
function fmtTime(t){
  const d = new Date(t);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function timeAgo(t){
  const s = (Date.now() - t) / 1000;
  if(s < 60) return '刚刚';
  if(s < 3600) return Math.floor(s/60) + ' 分钟前';
  if(s < 86400) return Math.floor(s/3600) + ' 小时前';
  if(s < 604800) return Math.floor(s/86400) + ' 天前';
  return fmtTime(t).slice(0, 10);
}
function genSku(){
  let sku, guard = 0;
  do{
    sku = 'SKU-' + Math.floor(1000 + Math.random() * 9000);
    guard++;
  }while(state.products.some(p => p.sku === sku) && guard < 50);
  return sku;
}
function stockStatus(p){
  if(p.qty <= 0) return { cls:'red', text:'缺货' };
  if(p.qty <= p.min) return { cls:'red', text:'库存不足' };
  if(p.qty <= p.min * 1.5) return { cls:'orange', text:'偏低' };
  return { cls:'green', text:'充足' };
}
function toast(msg, type){
  type = type || 'ok';
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.transition = '.25s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(24px)';
    setTimeout(() => el.remove(), 260);
  }, 2400);
}

/* ============================================================
   演示数据
   ============================================================ */
function seed(){
  const now = Date.now();
  const demo = [
    { name:'无线鼠标 M330',    sku:'SKU-1001', category:'电子配件', unit:'个', cost:68,   price:129, qty:42,  min:10  },
    { name:'机械键盘 K87',     sku:'SKU-1002', category:'电子配件', unit:'个', cost:210,  price:399, qty:8,   min:10  },
    { name:'USB-C 数据线 1m',  sku:'SKU-1003', category:'电子配件', unit:'条', cost:12,   price:29,  qty:5,   min:20  },
    { name:'A4 复印纸 70g',    sku:'SKU-2001', category:'办公用品', unit:'包', cost:18,   price:29,  qty:156, min:30  },
    { name:'中性笔 0.5mm',     sku:'SKU-2002', category:'办公用品', unit:'支', cost:1.2,  price:3,   qty:480, min:100 },
    { name:'文件夹 A4 蓝色',   sku:'SKU-2003', category:'办公用品', unit:'个', cost:4.5,  price:9,   qty:64,  min:20  },
    { name:'保温杯 500ml',     sku:'SKU-3001', category:'生活用品', unit:'个', cost:35,   price:79,  qty:26,  min:8   },
    { name:'抽纸 3 层 130 抽', sku:'SKU-3002', category:'生活用品', unit:'包', cost:3.8,  price:8,   qty:12,  min:24  },
  ];

  state.products = demo.map((d, i) => Object.assign({}, d, {
    id: uid(),
    createdAt: now - (demo.length - i) * 86400000
  }));

  state.records = [];
  state.products.forEach((p, i) => {
    state.records.push({
      id: uid(), productId: p.id, name: p.name, sku: p.sku,
      type: 'in', qty: p.qty, before: 0, after: p.qty,
      note: '期初建账入库', time: now - (demo.length - i) * 3600000 * 6
    });
  });
  // 加几条出库记录
  const outs = [
    { idx: 0, qty: 6,  note: '客户订单 #10231', h: 30 },
    { idx: 3, qty: 20, note: '客户订单 #10232', h: 20 },
    { idx: 1, qty: 4,  note: '客户订单 #10233', h: 9  },
    { idx: 4, qty: 60, note: '部门领用',        h: 4  },
  ];
  outs.forEach(o => {
    const p = state.products[o.idx];
    if(!p) return;
    const after = Math.max(0, p.qty - o.qty);
    state.records.push({
      id: uid(), productId: p.id, name: p.name, sku: p.sku,
      type: 'out', qty: o.qty, before: p.qty, after: after,
      note: o.note, time: now - o.h * 3600000
    });
  });
  state.records.sort((a, b) => b.time - a.time);
}

/* ============================================================
   库存变动核心
   ============================================================ */
function applyStock(product, type, qty, note){
  const before = product.qty;
  product.qty = type === 'in' ? before + qty : Math.max(0, before - qty);
  state.records.unshift({
    id: uid(),
    productId: product.id,
    name: product.name,
    sku: product.sku,
    type: type,
    qty: qty,
    before: before,
    after: product.qty,
    note: note || '',
    time: Date.now()
  });
}

/* ============================================================
   渲染：统计卡
   ============================================================ */
function renderStats(){
  const ps = state.products;
  const kinds = ps.length;
  const totalQty = ps.reduce((s, p) => s + p.qty, 0);
  const totalCost = ps.reduce((s, p) => s + p.qty * p.cost, 0);
  const totalRetail = ps.reduce((s, p) => s + p.qty * p.price, 0);
  const alertNum = ps.filter(p => p.qty <= p.min).length;

  const cards = [
    { icon: ICONS.box, bg:'#eef2fe', fg:'#4f6ef7', label:'商品种类', value: fmtNum(kinds), sub:'在库商品总数' },
    { icon: ICONS.layers, bg:'#e9f9f1', fg:'#12b76a', label:'库存总量', value: fmtNum(totalQty), sub:'所有商品数量合计' },
    { icon: ICONS.wallet, bg:'#f3f0ff', fg:'#7c5cff', label:'库存成本', value: money(totalCost), sub:'零售总值 ' + money(totalRetail) },
    { icon: ICONS.alert, bg:'#fef3f2', fg:'#f04438', label:'库存预警', value: fmtNum(alertNum), sub: alertNum ? '需要尽快补货' : '库存状况良好' },
  ];

  document.getElementById('statsGrid').innerHTML = cards.map(c => `
    <div class="stat">
      <div class="stat-icon" style="background:${c.bg};color:${c.fg}">${c.icon}</div>
      <div style="min-width:0">
        <div class="stat-label">${c.label}</div>
        <div class="stat-value">${c.value}</div>
        <div class="stat-sub">${c.sub}</div>
      </div>
    </div>`).join('');
}
